[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=5.20.4",
    "numpy>=2.4.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.2.2",
    "tqdm>=4.67.3",
    "uvicorn>=0.40.0",
    "huggingface-hub>=1.4.1",
    "mistral>=21.0.0",
    "fastapi>=0.128.8",
    "python-multipart>=0.0.22",
    "pypdf>=6.7.0",
    "langdetect>=1.0.9",
    "faiss-cpu>=1.13.2",
    "mistralai>=1.12.1",
    "chromadb>=1.5.0",
    "ollama>=0.6.1",
    "dotenv>=0.9.9",
    "google-genai>=0.5.0",
    "openai>=1.0.0",
    "pinecone>=3.0.0",
    "tenacity>=8.0.0",
    "accelerate>=1.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/examples", "src/retrieval/examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# E501: la longueur de ligne est déléguée au formatter.
# B008: idiome FastAPI standard (Depends(), File(), ... dans les valeurs par défaut).
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Les fichiers de test insèrent le dossier backend dans sys.path avant les
# imports `src.*`, et utilisent volontairement des pytest.raises(Exception)
# larges pour ces vérifications de configuration.
"src/tests/*" = ["E402", "B017"]

[tool.ruff.format]
quote-style = "double"
